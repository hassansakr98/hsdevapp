# Production stack: app + Caddy (automatic HTTPS via Let's Encrypt)
# Usage on the server:  docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - appdata:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env.production
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  appdata:
  caddy_data:
  caddy_config:
